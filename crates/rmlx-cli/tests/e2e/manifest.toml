# ─────────────────────────────────────────────────────────────────────────────
# 5. Phase 2a — state features (SSD cross-restart + prompt-cache reuse), LIVE.
# ─────────────────────────────────────────────────────────────────────────────

# SSD KV cross-restart: the runner owns two serve phases under single-MLX
# discipline with a dedicated hermetic RMLX_HOME (serve --kv-ssd-cache-gb 1
# --prompt-cache-slots 1 → spill → kill → restart same HOME → hydrate). PASS
# requires the restarted completion to be BYTE-IDENTICAL to phase 1 AND
# /metrics/cache ssd_hits >= 1 (the RAM miss was served from the .kvb spill,
# not a silent cold re-prefill). serve_flags / kv_quant are injected by
# assert_byte_identical_restart itself.
[[case]]
id = "ssd_byte_identical_restart"
feature = "ssd_kv_tier"
subfeature = "byte-identical restart (spill→restart→hydrate)"
model = "BONSAI"
serve_flags = []
assert = { kind = "byte_identical_restart" }
tags = ["run2a", "ssd"]

# Prompt-cache exact-prefix reuse: single server, prompt cache ON. Issue a long
# (≳600-token, multi-block) prompt twice. Bonsai/Qwen3 is ReusePolicy::ExactOnly
# so the second identical request is an EXACT prefix hit. PASS requires the
# second completion BYTE-IDENTICAL to the first (reuse must not change output)
# AND /metrics/cache block_hits to increment between the two requests (B
# genuinely took the cache path). Default --prompt-cache-slots (4) keeps the
# cache on; no extra flags needed.
[[case]]
id = "prompt_cache_prefix_reuse"
feature = "prompt_cache"
subfeature = "exact-prefix reuse (ExactOnly) — hit + output equivalence"
model = "BONSAI"
serve_flags = []
assert = { kind = "cache_hit_equivalence" }
tags = ["run2a", "prompt_cache"]

