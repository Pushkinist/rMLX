# rMLX E2E feature-proof manifest — Phase 1 (Bonsai run-1).
#
# One [[case]] per feature × sub-feature. The runner
# (`tests/e2e/runner.rs`) parses this, drives the real `rmlx` binary, and
# asserts. See `docs/E2E_TEST_PLAN.md`.
#
# Fields:
#   id          unique case id
#   feature     grid row group
#   subfeature  grid sub-row
#   model       env-var KEY ("BONSAI") → snapshot path; omit for model-free CLI
#   cli         [...] subcommand+flags ($MODEL substitutes the resolved path)
#   serve_flags [...] extra `rmlx serve` flags (paired with `request`)
#   request     named request fixture (see runner::request_fixture)
#   kv_quant    --kv-quant preset for serve cases
#   assert      { kind, expect, min_cosine }
#   tags        ["run1","quant",...]; "phase2" rows are stubbed, never executed

# ─────────────────────────────────────────────────────────────────────────────
# 1. CLI surface (no / low GPU)
# ─────────────────────────────────────────────────────────────────────────────

[[case]]
id = "cli_info_list_cache_types"
feature = "cli_surface"
subfeature = "info --list-cache-types"
# The table lists per-side codec tags (q8_g128, q4_g64, bf16), not composite
# KvQuant names; anchor on the stable bf16 row.
cli = ["info", "--list-cache-types"]
assert = { kind = "metric_present", expect = "q8_g128" }
tags = ["run1", "cli"]

[[case]]
id = "cli_info_probe_smoke"
feature = "cli_surface"
subfeature = "info --probe-smoke"
model = "BONSAI"
cli = ["info", "--model", "$MODEL", "--probe-smoke"]
assert = { kind = "exit_code", expect = "0" }
tags = ["run1", "cli"]

[[case]]
id = "cli_baseline_record"
feature = "cli_surface"
subfeature = "baseline --record"
model = "BONSAI"
# Explicit absolute --prompt: the bundled default resolves CWD-relative and the
# test CWD is the crate dir, not the workspace root.
cli = ["baseline", "--model", "$MODEL", "--prompt", "$FIXTURES/baseline_prompt_smoke.txt", "--max-tokens", "16", "--record"]
assert = { kind = "exit_code", expect = "0" }
tags = ["run1", "cli"]

[[case]]
id = "cli_metrics_query"
feature = "cli_surface"
subfeature = "metrics query"
cli = ["metrics", "query", "SELECT name FROM sqlite_master WHERE type='table'"]
assert = { kind = "metric_present", expect = "observations" }
tags = ["run1", "cli"]

[[case]]
id = "cli_healthcheck_full"
feature = "cli_surface"
subfeature = "healthcheck --full"
model = "BONSAI"
cli = ["healthcheck", "--model", "$MODEL", "--full"]
assert = { kind = "exit_code", expect = "0" }
tags = ["run1", "cli"]

# ─────────────────────────────────────────────────────────────────────────────
# 2. Text core (temp=0)
# ─────────────────────────────────────────────────────────────────────────────

[[case]]
id = "text_chat_nonstream"
feature = "text_core"
subfeature = "chat non-stream"
model = "BONSAI"
serve_flags = []
request = "chat_basic"
assert = { kind = "golden", expect = "Paris" }
tags = ["run1", "text"]

[[case]]
id = "text_chat_stream"
feature = "text_core"
subfeature = "chat stream"
model = "BONSAI"
serve_flags = []
request = "chat_stream"
# SSE stream exposes no per-token logprob bytes → substring+coherence, not a
# byte-for-byte golden. Honest kind: contains_coherent.
assert = { kind = "contains_coherent", expect = "Paris" }
tags = ["run1", "text"]

[[case]]
id = "text_anthropic_messages"
feature = "text_core"
subfeature = "anthropic /v1/messages"
model = "BONSAI"
serve_flags = []
request = "anthropic_basic"
# /v1/messages exposes no per-token logprob bytes → substring+coherence, not a
# byte-for-byte golden. Honest kind: contains_coherent.
assert = { kind = "contains_coherent", expect = "Paris" }
tags = ["run1", "text"]

[[case]]
id = "text_multi_turn"
feature = "text_core"
subfeature = "multi-turn"
model = "BONSAI"
serve_flags = []
request = "multi_turn"
assert = { kind = "coherent", expect = "teal" }
tags = ["run1", "text"]

[[case]]
id = "text_stop"
feature = "text_core"
subfeature = "stop sequence"
model = "BONSAI"
serve_flags = []
# stop_halts sends the same prompt with/without `stop` and asserts the stopped
# completion is strictly shorter (generation halted at the stop boundary).
#
# Stop sequences now truncate the content at the first match (stop string
# excluded) and set finish_reason="stop", for OpenAI + Anthropic, streaming +
# non-streaming, including token-straddling stops.
assert = { kind = "stop_halts" }
tags = ["run1", "text"]

[[case]]
id = "text_seed_determinism"
feature = "text_core"
subfeature = "seed determinism"
model = "BONSAI"
serve_flags = []
request = "chat_basic"
assert = { kind = "golden", expect = "Paris" }
tags = ["run1", "text"]

