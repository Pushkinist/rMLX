# ─────────────────────────────────────────────────────────────────────────────
# Phase 2b — multi-model lifecycle + attention dispatch (LIVE).
# ─────────────────────────────────────────────────────────────────────────────

# Multi-model lifecycle: the runner owns a registry-mode serve (Bonsai + a 2nd
# model resolved from GEMMA4_E2B) under single-MLX discipline. Proves:
#   (a) load A → loaded; (c) cap=1 warms the alphabetically-first id (one entry,
#   bounded to cap); explicit load B forces the LRU swap → B resident, A evicted
#   (status flips); (d) explicit unload B → loaded:false, 2nd unload →
#   404; (e) claim enforcement — a 2nd `rmlx serve` on the HELD port is rejected
#   (exit 11, no competing Metal context). When GEMMA4_E2B is absent the runner
#   runs the single-model subset (leg a + claim leg) and marks the 2-model legs
#   SKIPPED in the detail. A wrong status transition, a 2nd-process that wrongly
#   starts, or an unparseable status body all FAIL. serve flags injected by the
#   assertion itself (registry JSON + --max-loaded-models).
[[case]]
id = "p2_multi_model_lifecycle"
feature = "multi_model"
subfeature = "load / LRU-evict / unload / claim-enforcement"
model = "BONSAI"
serve_flags = []
assert = { kind = "model_lifecycle" }
tags = ["run2b", "multi_model"]

# Attention dispatch_fired (log scrape). HONEST signal: the only externally-
# observable per-dispatch signal is the `path` field on the `update_and_sdpa`
# trace span in the --log verbose run jsonl. On Bonsai/Qwen3 (head_dim=128) the
# specialised kernels (TurboFlash flash / fused_qk / planar_k_fused) stay
# DORMANT — warm-TTFT routes every decode step through the bf16-K seed
# (every dispatch records path=legacy). Their dispatch counters are process-
# internal atomics with no HTTP surface, covered by the in-crate counter tests
# (sparse_attn_dispatch.rs, iso_fused_qk_msl_tests.rs) — see
# docs/E2E_TEST_PLAN.md. This row proves the attention-dispatch instrumentation
# FIRES (>=1 update_and_sdpa span with a resolved path) AND output is coherent.
# FAILS if no dispatch span appears or output is incoherent.
