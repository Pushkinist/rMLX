[package]
name = "rmlx-cli"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rMLX binary entry: serve / chat / info."

[lints]
workspace = true

[[bin]]
name = "rmlx"
path = "src/main.rs"

[[example]]
name = "fused_qk_realmodel_probe"
path = "examples/fused_qk_realmodel_probe.rs"

[dependencies]
rmlx-audio   = { workspace = true }
rmlx-core    = { workspace = true }
rmlx-kv-quant = { workspace = true }
rmlx-kv-ssd  = { workspace = true }
rmlx-loader  = { workspace = true }
rmlx-metrics = { workspace = true }
rmlx-mlx     = { workspace = true }
rmlx-models  = { workspace = true }
rmlx-quant   = { workspace = true }
rmlx-server  = { workspace = true }
clap         = { workspace = true }
anyhow       = { workspace = true }
chrono       = { workspace = true }
tokio        = { workspace = true }
axum         = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
tokenizers   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
toml         = { workspace = true }
sha2         = "0.11"
uuid         = { version = "1", features = ["v4"] }
rusqlite     = { version = "0.40", features = ["bundled"] }
libc         = { workspace = true }
parking_lot  = { workspace = true }
tikv-jemallocator = { workspace = true }

# dhat-heap: OFF by default. Enable for heap-allocation profiling sessions only.
# See docs/PROFILING.md §4.
# Build: cargo build --features rmlx-cli/dhat-heap --bin rmlx
# Then: ./target/debug/rmlx baseline ...  (writes dhat-heap.json on exit)
[features]
dhat-heap = ["dep:dhat"]
# Debug-only Metal GPU trace capture. Adds the `--gpu-capture*` flags to
# `rmlx baseline` and the per-step hook in the shared decode loop. Off, neither
# the flags nor the hook exist, so a release binary cannot capture at all.
metal-capture = ["rmlx-mlx/metal-capture", "rmlx-models/metal-capture"]

[dev-dependencies]
tempfile     = { workspace = true }
rmlx-metrics = { workspace = true }
rusqlite     = { version = "0.40", features = ["bundled"] }

[dependencies.dhat]
version = "0.3"
optional = true
