thiserror    = { workspace = true }
tracing      = { workspace = true }
libc         = { workspace = true }
parking_lot  = { workspace = true }
rusqlite     = { version = "0.40", features = ["bundled"] }
chrono       = { workspace = true }
uuid         = { version = "1", features = ["v4"] }
