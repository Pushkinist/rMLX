# BENCHMARK_CHAMPIONS.md scope file.
#
# Lists the models that get rendered in the markdown export. Out-of-scope
# models are still recorded in metrics/runs.db, they are just hidden from the
# generated report.
#
# Editing this file does NOT touch the DB. Re-run:
#   rmlx metrics export --markdown --scope metrics/scope.toml > BENCHMARK_CHAMPIONS.md
#
# Excluded by user direction 2026-05-09:
#   - mlx-community/Laguna-XS.2-mxfp8     (out-of-tree custom arch)
#   - mlx-community/DR-Venus-4B-RL-mlx-8Bit (redundant with Bonsai/medgemma)

# ── Qwen3.5MoE family ─────────────────────────────────────────────────────────

[[model]]
namespace = "mlx-community"
name = "Qwen3.6-35B-A3B-8bit"
arch = "Qwen3.5MoE"
weight_quant_display = "affine 8b"
order = 1
aliases = [
  { namespace = "local",  name = "Qwen3.6-35B-A3B-8bit" },
  { namespace = "ollama", name = "qwen3.6:35b-a3b-coding-mxfp8" },
]
unsupported = []

[[model]]
namespace = "z-lab"
name = "Qwen3.6-27B-PARO"
arch = "Qwen3.5MoE"
weight_quant_display = "paroquant int4"
order = 2
aliases = [
  { namespace = "hf", name = "z-lab/Qwen3.6-27B-PARO" },
]
unsupported = [
  { backend = "omlx",   reason = "no paroquant support" },
  { backend = "mlx_lm", reason = "no paroquant support" },
  { backend = "ollama", reason = "no paroquant support" },
]

