# Pre-commit hooks. Install once: `pre-commit install`
# Run all hooks manually: `pre-commit run --all-files`

# `probes/*.hdr.metal` are captured verbatim from the Rust header builders and
# are equality-checked against them by unit tests. Whitespace fixups would edit
# the capture out from under those tests, so the whitespace hooks skip them.
GENERATED_CAPTURES: &generated_captures ^crates/.*/src/metal/probes/.*\.hdr\.metal$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: *generated_captures
      - id: end-of-file-fixer
        exclude: *generated_captures
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]   # weights / safetensors must never enter git
        # Silero VAD safetensors (1.2 MB, MIT) is an intentionally vendored asset.
        exclude: ^crates/rmlx-audio/assets/silero_vad_16k\.safetensors$
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Local hooks call the host toolchain (rustfmt, clippy, deny, audit).
  # Pre-installed via brew; no per-language env spinup.
  #
  # `scripts/fixtures/**` is excluded from both cargo hooks. Those .rs files are
  # synthetic scan roots for the source gates — deliberately uncompilable
  # snippets belonging to no cargo target, so neither `cargo fmt --all` nor
  # `cargo clippy --workspace` ever reads them. Without the exclude, editing one
  # fixture triggers a full workspace clippy that cannot say anything about it.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        exclude: ^scripts/fixtures/
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        exclude: ^scripts/fixtures/
        pass_filenames: false

      # MSL style gate. Fast (clang-format --dry-run over every gated kernel
      # directory) and skips itself when clang-format is unavailable. The
      # trigger must span all of `scripts/metal_dirs.sh`, not one crate: a
      # pattern narrower than the gate's own scope means editing a kernel in
      # another gated directory never fires the hook. The companion
      # `check-metal-compiles` gate is NOT run per-commit: it needs the full
      # Xcode Metal toolchain and compiles ~60 probes. It runs in `make ci`.
      - id: check-metal-format
        name: clang-format check (.metal)
        entry: bash scripts/check_metal_format.sh
        language: system
        files: ^crates/.*/src/metal/.*\.metal$
        pass_filenames: false

      # cargo-deny and cargo-audit are NOT run per-commit — they fetch the
      # RustSec advisory DB over the network and hang on slow links. Run them
      # via `make ci` (or `make audit` / `make deny`) before push, and the
      # `manual` stage keeps `pre-commit run --hook-stage manual` working.
      - id: cargo-deny
        name: cargo deny check
        entry: cargo deny --all-features check
        language: system
        files: ^(Cargo\.toml|Cargo\.lock|deny\.toml|crates/.*/Cargo\.toml)$
        pass_filenames: false
        stages: [manual]

      - id: cargo-audit
        name: cargo audit
        entry: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0119
        language: system
        files: ^(Cargo\.toml|Cargo\.lock|crates/.*/Cargo\.toml)$
        pass_filenames: false
        stages: [manual]
