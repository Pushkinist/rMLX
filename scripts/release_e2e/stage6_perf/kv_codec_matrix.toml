# KV-codec smoke + NIAH gate matrix.
#
# One row per (codec_name, model) cell. Primary key = (codec_name, model).
#
# Rows are consumed by `scripts/release_e2e/stage6_perf/codec_smoke_runner.sh`
# (see docs/TESTING.md "Codec smoke + NIAH matrix"). Each row drives:
#   1. Smoke prompts (`smoke_prompts.toml`) via `rmlx baseline` per-prompt.
#   2. The NIAH `cargo test -p rmlx-models --test niah_long_context`
#      harness at `context_length`, comparing measured retrieval to
#      `expected_retrieval_pct`.
#
# `expected_retrieval_pct = 0.0` means "baseline not yet recorded". Populate
# these via the runner's `--record-baseline` flag against the bf16 reference
# rows. Once populated, subsequent runs gate at `expected - 2%`.
#
# `skip_reason != ""` marks a cell as intentionally skipped:
#   * "qwen-moe-low-k-rejected" — Qwen MoE (Qwen3.6-MoE-8bit) rejects every
#                                 codec that stores K below 8 bits.
#   * "fused-qk-dispatch-pending" — fused-QK / sparse-attn rows; never run.
#   * a free-text reason        — the row's own comment says why.
#
# `cli_args` is the per-row `rmlx baseline` invocation suffix. The runner
# prepends `--model <resolved>` and the smoke-prompt content.
#
# `niah_filter` selects the NIAH cell filter (cargo-test test-name substring)
# for this row; the harness names are `niah_<model>_<ctx>k_d<depth>`. The
# runner runs all five depths for the model at `context_length / 1024 k`.

# ===========================================================================
# bonsai-8b (Qwen3ForCausalLM)
# ===========================================================================

