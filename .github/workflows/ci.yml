# rMLX CI — runs on GitHub-hosted macOS runners.
#
# `fmt` is link-free and always reliable. `build` needs the MLX / mlx-c
# libraries (rMLX links the stable mlx-c C ABI; it does not vendor MLX), so it
# installs them via Homebrew and points the build at the cellar prefix. `msl`
# needs neither Rust nor mlx-c — only the Metal toolchain the runner already
# ships — so it stays a seconds-long standalone check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only checks out the repo and compiles — no PR comments, no releases,
# no package writes. Pinning least-privilege here rather than relying on the
# repo-level default keeps the scope explicit, survives the workflow being
# copied, and does not silently widen if that default is ever changed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  gates:
    name: source gates
    # This job runs no tests — nothing here does. That is precisely why the
    # gate below exists: a GPU test left without the Metal-context `#[ignore]`
    # aborts the whole test binary, and the only thing that would have caught it
    # is a `cargo test --workspace` that this workflow never runs. The check is
    # static (bash + awk over the checked-in sources), needs neither a Rust
    # toolchain, mlx-c, nor a GPU, so it stays seconds-long and reports as its
    # own named check — and runs on Linux, which bills at a tenth of macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GPU-touching tests carry the Metal-context #[ignore]
        run: make check-gpu-tests-ignored
      # ...and that gate is a source scanner, so a shape it cannot parse is
      # indistinguishable from compliance. A macro_rules! body declaring
      # `#[test] fn $name()` was exactly that shape. Fixture workspaces pin the
      # recall in both directions — violations caught, legitimate shapes left be.
      - name: the #[ignore] gate still catches what it is for
        run: make check-gpu-tests-ignored-fixtures
      # A Metal-kernel dispatcher that blocks on Array::eval() produces exactly
      # the right tokens, so no test can see it — it only shows up as a decode
      # rate several times below what the codec should reach. Static gate.
      - name: kernel dispatchers keep their inputs lazy
        run: make check-no-kernel-input-eval
      # ...and the gate above is only worth its runtime if it still fires when
      # the eval is spelled differently, moved to a sub-directory, or hidden one
      # call deep in a shared scaffold. Fixture trees pin that recall.
      - name: the lazy-inputs gate still catches what it is for
        run: make check-no-kernel-input-eval-fixtures
      # MLX 0.31.x fills a process-global CPU command-encoder map with no
      # synchronisation, so two threads evaluating at once corrupt it and the
      # process dies inside MLX with no failing test named. Serialising every
      # evaluation is the fix; this gate is what keeps a new FFI call from
      # quietly stepping outside it. Static — the local reproducer is
      # probabilistic and deliberately not run here.
      - name: MLX eval FFI calls are made under the evaluation lock
        run: make check-eval-lock
      # ...and the gate above is one regex edit from matching nothing and
      # passing forever. Fixture trees pin its recall, per rule.
      - name: the eval-lock gate still catches what it is for
        run: make check-eval-lock-fixtures

  msl:
    name: msl kernels (compile + format)
    # This runner ships full Xcode, so the Metal compiler is available here (see
    # the toolchain step) even though a Command-Line-Tools-only dev box has none.
    # Compiling `.metal` needs the toolchain, not a GPU — so this gate runs for
    # real on a runner with no usable Metal device. This is the job that makes
    # MSL syntax errors surface at CI instead of on first GPU dispatch.
    #
    # macos-26, not macos-14, for one specific reason: the compile gate makes a
    # second pass at -std=metal4.0 — the language version MLX's JIT actually
    # compiles custom kernel bodies at — and refuses to pass by checking less
    # when the toolchain cannot reach it. macos-14 tops out at Xcode 16.2, which
    # has no Metal 4.
    #
    # No Rust toolchain and no mlx-c: both gates are bash + xcrun over the
    # checked-in .metal files, so this job stays seconds-long and reports as its
    # own named check.
    runs-on: macos-26 # Apple Silicon; full Xcode with a Metal 4 toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Xcode 16.3+ unbundled the Metal compiler into a downloadable component,
      # so "full Xcode" no longer guarantees `xcrun metal`. Fetch it when it is
      # missing, then assert it resolved: this job exists to compile MSL, so a
      # missing compiler must fail here rather than quietly degrade.
      - name: Ensure Metal toolchain
        run: |
          if ! xcrun -sdk macosx -f metal >/dev/null 2>&1; then
            echo "Metal compiler absent — downloading the Metal toolchain component."
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx -f metal \
            || { echo "::error::Metal compiler unavailable; MSL gate cannot run"; exit 1; }
      - name: Show toolchain
        run: |
          xcode-select -p
          xcrun -sdk macosx metal --version 2>&1 | head -2 || true
          printf '#include <metal_stdlib>\n' > /tmp/std_probe.metal
          if xcrun -sdk macosx metal -std=metal4.0 -c /tmp/std_probe.metal -o /tmp/std_probe.air; then
            echo "Metal 4 language version available."
          else
            echo "::warning::-std=metal4.0 unavailable; the compile gate will fail (it refuses to check less)."
          fi
          "$(xcrun -f clang-format)" --version
      # METAL_STRICT=--strict makes a missing toolchain — or one too old for the
      # metal4.0 pass — a hard failure. Without it both gates skip when their
      # tool is absent, which is correct locally and wrong here: on this runner
      # the tools exist, so a skip would mean the gate silently passed without
      # checking anything.
      - name: .metal clang-format clean (strict)
        run: make check-metal-format METAL_STRICT=--strict
      - name: .metal kernels compile natively (strict)
        run: make check-metal-compiles METAL_STRICT=--strict

  build:
    name: build + clippy
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Install MLX (provides mlx-c)
        run: brew install mlx-c
      - name: Resolve MLX_C_PREFIX
        run: echo "MLX_C_PREFIX=$(brew --prefix mlx-c)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: build
        run: cargo build --workspace --release
      # The full test suite runs on Apple Silicon HARDWARE, not here: many tests
      # need a real Metal GPU and normal machine specs, while GitHub-hosted macOS
      # runners are VMs (~7 GB RAM, limited/again no usable Metal device). Run
      # `make test` locally or wire a self-hosted Apple Silicon runner. Hosted CI
      # validates formatting, lint, and a clean release build.
